spring.application.name=karlaapi

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_rede_eletrica}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:141724Ka!}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.mapper.accept-case-insensitive-enums=true

server.port=${PORT:8081}

api.viacep.url=https://viacep.com.br/ws/

api.openstreetmap.url=https://nominatim.openstreetmap.org
api.openstreetmap.useragent=Infnet-Karla-Georef-App-2026
api.openstreetmap.email=karla@example.com

# =========================
# ACTUATOR / OBSERVABILIDADE
# =========================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.prometheus.metrics.export.enabled=true

# opcional, mas útil para organização
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}