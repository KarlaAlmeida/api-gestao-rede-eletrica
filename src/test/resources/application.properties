spring.application.name=karlaapi
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS auth
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.jackson.mapper.accept-case-insensitive-enums=true
karlaapitdd.url=http://localhost:8080
api.viacep.url=https://viacep.com.br/ws/
api.openstreetmap.url=https://nominatim.openstreetmap.org
